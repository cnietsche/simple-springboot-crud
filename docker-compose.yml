services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: h2
      H2_DATA_PATH: /app/data
    expose:
      - "8080"
    volumes:
      - backend-data:/app/data
    networks:
      - app-network

  agent-simulator:
    build:
      context: ./agent-simulator
      dockerfile: Dockerfile
    environment:
      BACKEND_BASE_URL: http://backend:8080
      SQLITE_PATH: /data/simulator.db
    expose:
      - "8081"
    volumes:
      - agent-simulator-data:/data
    depends_on:
      - backend
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
      - agent-simulator
    networks:
      - app-network

networks:
  app-network:

volumes:
  backend-data:
  agent-simulator-data:
